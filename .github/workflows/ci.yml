# Build and test on every push and pull request (NFR-4.4, DOM-MAIN-7).
# Every action is pinned to a full commit SHA, with its version in a comment (DOM-SEC-10).
name: CI

on:
  push:
  pull_request:

# Least privilege by default (DOM-SEC-11).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java 21 runs the build (Robolectric's simulated Android 15+ requires it); the code still targets Java 17 bytecode.
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper JAR checksum (DOM-SEC-6).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Compiles with warnings as errors, verifies every downloaded artifact against
      # gradle/verification-metadata.xml, and runs all example-based, property-based
      # and performance smoke tests. A failing property test prints its seed.
      - name: Build and test
        run: ./gradlew build koverXmlReport koverHtmlReport --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 30

  # Feeds GitHub's dependency graph, which drives Dependabot alerts, dependency review on pull
  # requests, and the on-demand SBOM export (DOM-SEC-8, DOM-SEC-9).
  dependency-submission:
    name: Submit dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # The action injects its own Gradle plugin, which isn't in verification-metadata.xml.
      # This job only reads the dependency graph and builds nothing, so verification is lenient here.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          additional-arguments: --dependency-verification=lenient
